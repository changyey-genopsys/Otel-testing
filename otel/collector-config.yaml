receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 512
    check_interval: 1s

  batch:

  resource:
  
exporters:
  debug:
    verbosity: detailed

  elasticsearch:
    endpoints:
      - http://elasticsearch:9200
    mapping:
      mode: otel

    logs_dynamic_index:
      enabled: true

    metrics_dynamic_index:
      enabled: true

    traces_dynamic_index:
      enabled: true


service:
  pipelines:
    logs:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters: [elasticsearch, debug]
        # - elasticsearch/logs

    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters: [elasticsearch, debug]
        # - elasticsearch/traces