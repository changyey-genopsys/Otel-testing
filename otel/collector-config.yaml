receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 512
    check_interval: 1s

  batch:
  
exporters:
  debug:
    verbosity: detailed

  elasticsearch/logs:
    endpoints:
      - http://elasticsearch:9200
    mode: data_stream 

  elasticsearch/traces:
    endpoints:
      - http://elasticsearch:9200
    mode: data_stream 

service:
  pipelines:
    logs:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters: [elasticsearch/logs, debug]
        # - elasticsearch/logs

    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters: [elasticsearch/traces, debug]
        # - elasticsearch/traces