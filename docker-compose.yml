services:
  app:
    build:
      context: .

    container_name: ts-app
    volumes:
      - .:/workspace:cached

    command: "sleep infinity"

    ports:
      - "3000:3000"

    depends_on:
      - elasticsearch
    networks:
      - dev_network

  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest

  #   container_name: otel-collector

  #   command:
  #     - "--config=/etc/otel/config.yaml"

  #   volumes:
  #     - ./otel/collector-config.yaml:/etc/otel/config.yaml

  #   ports:
  #     - "4317:4317"
  #     - "4318:4318"

  #   depends_on:
  #     - elasticsearch
  #   networks:
  #     - dev_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2

    container_name: elasticsearch

    # xpack.security.enabled=false only for develop
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - action.auto_create_index=true

    # mem_limit: 2GB
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health?local=true | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 5


  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2

    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    # mem_limit: 1GB
    ports:
      - "5601:5601"
    # volumes:
    #   - kibana_data:/usr/share/kibana/data
    networks:
      - dev_network
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es_data:
    driver: local
  # kibana_data:
  #   driver: local

networks:
  dev_network:
    driver: bridge
